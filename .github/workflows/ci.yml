name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: kovsh
          POSTGRES_PASSWORD: kovsh
          POSTGRES_DB: kovsh_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kovsh" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kovsh/contracts build
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://kovsh:kovsh@localhost:5432/kovsh_test
          TEST_REDIS_URL: redis://localhost:6379/15
      - run: pnpm build
