# Тестовый стенд «Ковш на Час» для проверки приложений на телефонах.
# Тестовые провайдеры (SMS — в админке «Тестовые SMS», оплата без денег, маршруты и адреса — приблизительные).
# Запуск: см. README.md рядом.
name: kovsh-stand

services:
  postgres:
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.4}
    restart: unless-stopped
    environment:
      POSTGRES_USER: kovsh
      POSTGRES_PASSWORD: ${DB_PASSWORD:?запустите ./init.sh}
      POSTGRES_DB: kovsh
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kovsh"]
      interval: 5s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgres://kovsh:${DB_PASSWORD}@postgres:5432/kovsh
      REDIS_URL: redis://redis:6379/0
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/storage
      PUBLIC_BASE_URL: https://api.${STAND_DOMAIN}
      CUSTOMER_WEB_URL: https://app.${STAND_DOMAIN}
      TRUST_PROXY: "true"
      JOBS_AUTORUN: "true"
    # Миграции применяются при каждом старте (повторный запуск ничего не меняет).
    command: ["sh", "-c", "node dist/database/migrate.cli.js && node dist/main.js"]
    volumes: [storage:/data/storage]

  web:
    build:
      context: ../..
      dockerfile: infra/stand/web.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    environment:
      STAND_DOMAIN: ${STAND_DOMAIN}
    volumes: [caddydata:/data, caddyconfig:/config]

volumes:
  pgdata:
  redisdata:
  storage:
  caddydata:
  caddyconfig:
